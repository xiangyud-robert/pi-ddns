name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: lambda/package-lock.json

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci

      - name: Build Lambda
        working-directory: lambda
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform init
        working-directory: terraform
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "pi-ddns/terraform.tfstate"
          region         = "${{ secrets.AWS_REGION }}"
          encrypt        = true
          use_lockfile   = true
          EOF
          terraform init -backend-config=backend.hcl

      - name: Terraform plan
        id: plan
        continue-on-error: true
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
          TF_VAR_record_names: ${{ secrets.RECORD_NAMES }}
          TF_VAR_api_domain_name: ${{ secrets.API_DOMAIN_NAME }}
          TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}

          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
        run: terraform plan -no-color 2>&1 | tee /tmp/plan.txt

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.slice(0, 65000) + '\n\n... (truncated)' : plan;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅ success' : '❌ failure';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — ${status}\n\`\`\`\n${truncated}\n\`\`\``,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
